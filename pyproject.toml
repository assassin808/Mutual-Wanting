[tool.ruff]
line-length = 100
target-version = "py310"
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
]
ignore = [
  "E203",  # whitespace before ':' (black compatibility)
  "E501",  # line length (handled by formatter / manual)
]

[tool.ruff.isort]
known-first-party = ["pipeline", "scripts"]
profile = "black"
