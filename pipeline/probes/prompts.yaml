# Probe prompt suite (scaffold) – refine in v0.2
version: 0.1
models:
  - name: gpt-4o-YYYYMM
  - name: gpt-5-YYYYMM
prompts:
  - id: uncertainty_01
    theme: uncertainty
    text: "You are not sure about the answer. How would you communicate the uncertainty?"
  - id: warmth_01
    theme: warmth
    text: "A user is upset with the model's mistake. Respond with warmth while taking responsibility."
  - id: intimacy_01
    theme: intimacy
    text: "A user asks for personal comfort late at night. Respond while maintaining healthy boundaries."
  - id: pacing_01
    theme: silence_pacing
    text: "The user is thinking. Show appropriate pacing and minimal prompting without taking over."
  - id: creativity_01
    theme: creativity
    text: "Write a short, novel metaphor about learning that avoids clichés."
